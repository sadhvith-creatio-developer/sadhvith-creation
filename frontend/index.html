<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ════════════════════════════════════════════════════════
         VIEWPORT & THEME
    ════════════════════════════════════════════════════════ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F97316" />

    <!-- ════════════════════════════════════════════════════════
         CORE SEO  (static fallback — React overwrites these on
         each route via useSEO.js)
    ════════════════════════════════════════════════════════ -->
    <title>Sadhvith Creation | Handcrafted Products Made with Care</title>

    <meta
      name="description"
      content="Shop handcrafted, thoughtfully designed products from Sadhvith Creation. Wooden name plates, custom gifts, and more — made with care and delivered across India."
    />
    <meta
      name="keywords"
      content="sadhvith creation, handcrafted products, wooden name plates, custom gifts, handmade india, personalized gifts"
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Sadhvith Creation" />

    <!-- ════════════════════════════════════════════════════════
         CANONICAL  (homepage default; React updates per-route)
    ════════════════════════════════════════════════════════ -->
    <link rel="canonical" href="https://sadhvith-creation.vercel.app/" />

    <!-- ════════════════════════════════════════════════════════
         OPEN GRAPH  (Facebook, LinkedIn, WhatsApp previews)
    ════════════════════════════════════════════════════════ -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://sadhvith-creation.vercel.app/" />
    <meta property="og:site_name"   content="Sadhvith Creation" />
    <meta property="og:locale"      content="en_IN" />
    <meta
      property="og:title"
      content="Sadhvith Creation | Handcrafted Products Made with Care"
    />
    <meta
      property="og:description"
      content="Shop handcrafted, thoughtfully designed products from Sadhvith Creation. Made with care and delivered across India."
    />
    <meta
      property="og:image"
      content="https://sadhvith-creation.vercel.app/og-default.jpg"
    />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"    content="Sadhvith Creation — Handcrafted Products" />

    <!-- ════════════════════════════════════════════════════════
         TWITTER CARD
    ════════════════════════════════════════════════════════ -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@sadhvithcreation" />
    <meta
      name="twitter:title"
      content="Sadhvith Creation | Handcrafted Products Made with Care"
    />
    <meta
      name="twitter:description"
      content="Shop handcrafted, thoughtfully designed products from Sadhvith Creation."
    />
    <meta
      name="twitter:image"
      content="https://sadhvith-creation.vercel.app/og-default.jpg"
    />

    <!-- ════════════════════════════════════════════════════════
         GOOGLE SEARCH CONSOLE VERIFICATION
         (your file already exists at /public/google61d841da18ae6b36.html;
          the meta tag below is an alternative approach — use either one)
    ════════════════════════════════════════════════════════ -->
    <meta name="google-site-verification" content="61d841da18ae6b36" />

    <!-- ════════════════════════════════════════════════════════
         FAVICON & TOUCH ICONS
         Replace /favicon.svg and /apple-touch-icon.png with
         real assets generated at https://realfavicongenerator.net
    ════════════════════════════════════════════════════════ -->
    <link rel="icon"             type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon"             type="image/png"     href="/favicon-32x32.png" sizes="32x32" />
    <link rel="apple-touch-icon"                      href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest"                              href="/site.webmanifest" />

    <!-- ════════════════════════════════════════════════════════
         FONTS  (preconnect first, then stylesheet)
    ════════════════════════════════════════════════════════ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />

    <!-- ════════════════════════════════════════════════════════
         SITE-WIDE STRUCTURED DATA  (static; also injected by
         useSEO.js so crawlers that render JS see it too)
    ════════════════════════════════════════════════════════ -->
    <script type="application/ld+json" data-id="website">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Sadhvith Creation",
      "url": "https://sadhvith-creation.vercel.app",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://sadhvith-creation.vercel.app/products?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <script type="application/ld+json" data-id="organization">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Sadhvith Creation",
      "url": "https://sadhvith-creation.vercel.app",
      "logo": "https://sadhvith-creation.vercel.app/favicon.svg",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "availableLanguage": ["English", "Telugu", "Kannada"]
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
